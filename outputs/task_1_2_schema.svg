<text x="496" y="934" class="name">bridge_employee_project</text>
<text x="496" y="977" class="dtype">Employee-version + project + role</text>
<text x="496" y="1003" class="field">employee_key</text>
<text x="496" y="1020" class="dtype">INTEGER ? PK / FK</text>
<text x="496" y="1049" class="field">project_key</text>
<text x="496" y="1066" class="dtype">INTEGER ? PK / FK</text>
<text x="496" y="1095" class="field">role_in_project</text>
