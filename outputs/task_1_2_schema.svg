<text x="496" y="1141" class="field">assigned_from / assigned_to</text>
<text x="496" y="1158" class="dtype">DATE</text>
<text x="40" y="1260" class="sub">Employee history: UNIQUE(employee_id, valid_from); CHECK(valid_from &lt; valid_to).</text>
<text x="40" y="1290" class="sub">Bridge primary key combines employee_key, project_key and role_in_project.</text>
<text x="40" y="1320" class="sub">project_manager_id and manager_id are source IDs, not declared foreign keys.</text>
<text x="40" y="1350" class="sub">Grouped field names share the displayed type. All six tables and all columns are included.</text>
